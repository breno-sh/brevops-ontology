    evidence: []
  - provider: oci
    status: unknown
    evidence: []
- probe_type: item_ttl
  preconditions:
  - tabela ou coleção com TTL habilitado no atributo declarado, lida de volta como PERSISTED
  - itens sintéticos com expiração 1 h depois da gravação
  - supervisor independente com heartbeat ativo (D16); sem ele, o tipo sai da amostra
  negative_control:
    description: itens iguais sem o atributo de TTL (ou TTL desligado)
    expected: itens continuam legíveis no fim da janela
  repetitions: 3
  tolerance:
    kind: exact
