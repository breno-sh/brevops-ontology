- probe_type: queue_retention
  preconditions:
  - fila com a retenção do caso no menor valor permitido pelo provedor; se o mínimo passa de 24 h, PROTOCOL_UNSUPPORTED antes do sorteio
  - mensagens sintéticas sem conteúdo real; nenhum consumidor durante a janela
  - supervisor independente com heartbeat ativo (D16); sem ele, o tipo sai da amostra
  negative_control:
    description: mesma fila com retenção maior que a janela
    expected: mensagens continuam disponíveis no fim da janela
  repetitions: 3
  tolerance:
    kind: exact
    value: 0
  polling:
    interval: PT1H
    max_wait: PT48H
