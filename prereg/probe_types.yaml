    evidence: []
- probe_type: rate_limit
  preconditions:
  - limite de taxa do caso declarado com JANELA (período de renovação), CHAVE (por chave de assinatura, por IP de origem ou total), RAJADA (capacidade do balde) e MECANISMO (balde de fichas ou janela fixa), lidos do SERVICE-EVIDENCE
  - endpoint sintético sem backend real; uma única chave de cliente por repetição
  - N = 3 × (rajada + taxa × janela) pedidos enviados numa janela
  negative_control:
    description: mesmo protocolo sem limite configurado (ou limite 100 vezes maior)
    expected: nenhuma resposta de limitação (HTTP 429) na janela
  repetitions: 3
  tolerance:
    kind: relative
    value: 0.2
  polling:
    interval: PT1S
    max_wait: PT10M
