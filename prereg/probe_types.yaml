probe_types:
- probe_type: object_versioning
  preconditions:
  - bucket ou contêiner novo da execução, com a configuração de versionamento do caso aplicada e lida de volta como PERSISTED
  - objeto sintético de 1 KiB, sem conteúdo real; gravado 3 vezes com a mesma chave
  negative_control:
    description: mesmo protocolo em contêiner com versionamento desligado ou suspenso
    expected: uma única versão listada da chave
  repetitions: 3
  tolerance:
    kind: exact
    value: 0
  polling:
    interval: PT1M
    max_wait: PT30M
  window:
    duration: PT1H
    margin_over_ttl: PT30M
  cost_limit:
    amount: 0.5
    currency: USD
  validated_support:
  - provider: aws
    status: unknown
    evidence: []
  - provider: google
    status: unknown
    evidence: []
  - provider: azurerm
    status: unknown
    evidence: []
  - provider: oci
    status: unknown
    evidence: []
- probe_type: object_lifecycle
  preconditions:
  - regra de ciclo de vida do caso com a menor idade permitida pelo provedor (1 dia onde a unidade é dia), lida de volta como PERSISTED
  - objetos sintéticos com idade conhecida
  - supervisor independente com heartbeat ativo (D16); sem ele, o tipo sai da amostra
  negative_control:
    description: mesmo protocolo em contêiner sem regra de ciclo de vida
    expected: objetos continuam presentes no fim da janela
  repetitions: 3
  tolerance:
    kind: exact
    value: 0
  polling:
    interval: PT6H
    max_wait: PT72H
  window:
    duration: PT72H
    margin_over_ttl: PT48H
  cost_limit:
