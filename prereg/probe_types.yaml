    evidence: []
  - provider: azurerm
    status: unknown
    evidence: []
  - provider: oci
    status: unknown
    evidence: []
- probe_type: log_retention
  preconditions:
  - grupo ou bucket de log com a retenção do caso no menor valor permitido (1 dia onde existe); se o mínimo passa de 3 dias, PROTOCOL_UNSUPPORTED antes do sorteio
  - eventos sintéticos sem conteúdo real; o conteúdo dos logs nunca é gravado, só contagens e datas
  - supervisor independente com heartbeat ativo (D16); sem ele, o tipo sai da amostra
  negative_control:
    description: mesmo protocolo com retenção maior que a janela
    expected: eventos continuam consultáveis no fim da janela
