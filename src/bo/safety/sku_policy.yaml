    tag_attribute: freeform_tags
    class_c: ["^oci_identity_domains_", "^oci_database_db_system$"]
    types:
      oci_identity_compartment:
        cost: {hourly: 0}
        rules: {enable_delete: {eq: true, why: "sem enable_delete o destroy só esquece o compartment"}}
        removal: {mode: async, pending_hours: 2, residual_state: absent, max_residual_usd: 0.0}
        trace: tag
        delete_order: 0
      oci_core_vcn: {cost: {hourly: 0}, trace: tag, delete_order: 10}
      oci_core_subnet: {cost: {hourly: 0}, trace: tag, delete_order: 20}
      oci_core_internet_gateway: {cost: {hourly: 0}, trace: tag, delete_order: 25}
      oci_core_route_table: {cost: {hourly: 0}, trace: tag, delete_order: 30}
