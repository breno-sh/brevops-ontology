      google_compute_router: {cost: {hourly: 0}, trace: name, delete_order: 30}
      google_compute_router_nat:
        cost: {hourly: 0.0014, egress_gb: 0.045}
        trace: name
        delete_order: 50
      google_compute_address: {cost: {hourly: 0.01}, trace: tag, delete_order: 35}
      google_compute_global_address: {cost: {hourly: 0.01}, trace: tag, delete_order: 35}
      google_compute_forwarding_rule: {cost: {hourly: 0.025, egress_gb: 0.12}, trace: tag, delete_order: 55}
      google_storage_bucket:
        cost: {storage_gb_month: 0.026, egress_gb: 0.12, per_million_requests: 5.0}
        rules:
          force_destroy: {eq: true}
          storage_class: {in: [STANDARD], sku: true}
          retention_policy.0.is_locked: {absent: [true], why: "retenção travada impede apagar o bucket"}
        trace: tag
        delete_order: 40
      google_pubsub_topic: {cost: {per_million_requests: 0.04}, trace: tag, delete_order: 40}
      google_pubsub_subscription: {cost: {per_million_requests: 0.04}, trace: tag, delete_order: 50}
      google_cloud_run_v2_service:
        cost: {per_million_requests: 0.40, egress_gb: 0.12}
        rules:
          deletion_protection: {absent: [true]}
          template.0.scaling.0.max_instance_count: {max: 2}
        trace: tag
        delete_order: 50
      google_cloudfunctions2_function: {cost: {per_million_requests: 0.40, egress_gb: 0.12}, trace: tag, delete_order: 50}
      google_logging_metric: {cost: {hourly: 0}, trace: name, delete_order: 50}
      google_service_account: {cost: {hourly: 0}, trace: name, delete_order: 30}
      google_project_iam_member: {cost: {hourly: 0}, trace: ref, delete_order: 70}
      google_kms_key_ring:
        cost: {hourly: 0}
        removal: {mode: retained, purge_days: 0, residual_state: purge_scheduled, max_residual_usd: 0.0}
        trace: name
        delete_order: 10
      google_kms_crypto_key:
        cost: {hourly: 0.0001, per_million_requests: 3.0}
        rules:
          destroy_scheduled_duration: {in: ["86400s"], why: "versões destruídas em 1 dia (mínimo)"}
          purpose: {in: [ENCRYPT_DECRYPT], sku: true}
          version_template.0.protection_level: {absent: [HSM, EXTERNAL, EXTERNAL_VPC], sku: true}
        removal: {mode: retained, purge_days: 1, residual_state: purge_scheduled, max_residual_usd: 0.1}
        trace: tag
        delete_order: 20
      google_sql_database_instance:
        cost: {hourly: 0.0105, storage_gb_month: 0.17, egress_gb: 0.12}
        rules:
          settings.0.tier: {in: [db-f1-micro], sku: true}
          settings.0.disk_size: {max: 10, sku: true}
          settings.0.availability_type: {absent: [REGIONAL], sku: true}
          settings.0.edition: {absent: [ENTERPRISE_PLUS], sku: true}
          deletion_protection: {eq: false}
          settings.0.deletion_protection_enabled: {absent: [true]}
        removal: {mode: async, pending_hours: 1, residual_state: absent, max_residual_usd: 0.05}
        trace: name
        delete_order: 50
      google_redis_instance:
        cost: {hourly: 0.049}
        rules:
          tier: {in: [BASIC], sku: true}
          memory_size_gb: {max: 1, sku: true}
        trace: tag
        delete_order: 50
      google_firestore_database:
        cost: {storage_gb_month: 0.18, per_million_requests: 1.8}
        rules:
          delete_protection_state: {absent: [DELETE_PROTECTION_ENABLED]}
          deletion_policy: {eq: DELETE, why: "o padrão ABANDON deixa o banco depois do destroy"}
        trace: name
        delete_order: 40
      google_firestore_field: {cost: {hourly: 0}, trace: ref, delete_order: 60}
  azurerm:
    regions_allowed: [eastus]
    tag_attribute: tags
    class_c: ["^azurerm_firewall", "^azurerm_application_gateway", "^azurerm_web_application_firewall",
              "^azurerm_frontdoor", "^azurerm_management_group"]
    types:
      azurerm_resource_group: {cost: {hourly: 0}, removal: {mode: async, pending_hours: 1, residual_state: absent, max_residual_usd: 0.0}, trace: tag, delete_order: 0}
      azurerm_virtual_network: {cost: {hourly: 0}, trace: tag, delete_order: 10}
      azurerm_subnet: {cost: {hourly: 0}, trace: name, delete_order: 20}
      azurerm_network_security_group: {cost: {hourly: 0}, trace: tag, delete_order: 30}
      azurerm_network_security_rule: {cost: {hourly: 0}, trace: name, delete_order: 60}
      azurerm_subnet_network_security_group_association: {cost: {hourly: 0}, trace: ref, delete_order: 65}
      azurerm_storage_account:
        cost: {storage_gb_month: 0.021, egress_gb: 0.087, per_million_requests: 6.5}
        rules:
          account_tier: {in: [Standard], sku: true}
          account_replication_type: {in: [LRS], sku: true}
          account_kind: {in: [StorageV2], sku: true}
          access_tier: {absent: [Premium], sku: true}
        trace: tag
        delete_order: 40
      azurerm_storage_container: {cost: {hourly: 0}, trace: name, delete_order: 50}
      azurerm_servicebus_namespace:
        cost: {hourly: 0.0137, per_million_requests: 0.80}
        rules: {sku: {in: [Basic, Standard], sku: true}}
        trace: tag
        delete_order: 40
      azurerm_servicebus_queue: {cost: {hourly: 0}, trace: name, delete_order: 50}
      azurerm_key_vault:
        cost: {per_million_requests: 3.0}
        rules:
          sku_name: {in: [standard], sku: true}
          purge_protection_enabled: {absent: [true], why: "com purge protection o cofre fica 90 dias"}
          soft_delete_retention_days: {eq: 7}
        removal: {mode: soft_delete, purge_days: 7, residual_state: purge_scheduled, max_residual_usd: 0.0}
        trace: tag
        delete_order: 40
      azurerm_service_plan:
        cost: {hourly: 0}
        rules: {sku_name: {in: [Y1], sku: true, why: "só consumo"}}
        trace: tag
        delete_order: 30
      azurerm_linux_function_app: {cost: {per_million_requests: 0.20, egress_gb: 0.087}, trace: tag, delete_order: 50}
      azurerm_log_analytics_workspace:
        cost: {storage_gb_month: 0.10, egress_gb: 2.76}
        rules: {sku: {in: [PerGB2018], sku: true}, retention_in_days: {max: 30}}
        trace: tag
        delete_order: 40
      azurerm_postgresql_flexible_server:
        cost: {hourly: 0.03, storage_gb_month: 0.115, egress_gb: 0.087}
        rules:
          sku_name: {in: [B_Standard_B1ms], sku: true}
          storage_mb: {max: 32768, sku: true}
          high_availability.0.mode: {absent: [ZoneRedundant, SameZone], sku: true}
          backup_retention_days: {max: 7}
          geo_redundant_backup_enabled: {absent: [true], sku: true}
        removal: {mode: async, pending_hours: 1, residual_state: absent, max_residual_usd: 0.05}
        trace: tag
        delete_order: 50
      azurerm_mssql_server: {cost: {hourly: 0}, trace: tag, delete_order: 40}
      azurerm_mssql_database:
        cost: {hourly: 0.0069, storage_gb_month: 0.0, egress_gb: 0.087}
        rules:
          sku_name: {in: [Basic], sku: true}
          max_size_gb: {max: 2, sku: true}
          zone_redundant: {absent: [true], sku: true}
        trace: tag
        delete_order: 50
      azurerm_public_ip:
        cost: {hourly: 0.005}
        rules: {sku: {in: [Standard], sku: true}}
        trace: tag
        delete_order: 35
      azurerm_lb:
        cost: {hourly: 0.025, egress_gb: 0.005}
        rules: {sku: {in: [Standard], sku: true}}
        trace: tag
        delete_order: 50
      azurerm_nat_gateway:
        cost: {hourly: 0.045, egress_gb: 0.045}
        rules: {sku_name: {in: [Standard], sku: true}}
        trace: tag
        delete_order: 55
      azurerm_cdn_frontdoor_profile:
        cost: {hourly: 0.048, egress_gb: 0.083, per_million_requests: 0.01}
        rules: {sku_name: {in: [Standard_AzureFrontDoor], sku: true, why: "Premium é Classe C"}}
        trace: tag
        delete_order: 50
      azurerm_cosmosdb_account:
        cost: {storage_gb_month: 0.25, per_million_requests: 0.25}
        rules:
          offer_type: {in: [Standard], sku: true}
          capabilities.0.name: {in: [EnableServerless], sku: true, why: "só serverless (sem RU provisionado)"}
          geo_location.1.location: {absent: [], sku: true}
