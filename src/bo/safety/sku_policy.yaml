        delete_order: 50
      azurerm_api_management:
        cost: {per_million_requests: 3.5, egress_gb: 0.087}
        rules: {sku_name: {in: [Consumption_0], sku: true}}
        removal: {mode: soft_delete, purge_days: 2, residual_state: purge_scheduled, max_residual_usd: 0.0}
        trace: tag
        delete_order: 50
  oci:
