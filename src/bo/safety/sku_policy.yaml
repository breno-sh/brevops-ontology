          table_limits.0.max_storage_in_gbs: {max: 25, sku: true}
          is_auto_reclaimable: {eq: true, why: "tabela Always Free"}
        trace: tag
        delete_order: 40
      oci_queue_queue:
        cost: {per_million_requests: 0.0}
        rules: {retention_in_seconds: {max: 86400}}
        trace: tag
        delete_order: 40
