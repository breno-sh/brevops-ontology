# Regras do grão canônico (BrevOps Ontology, módulo GRAIN, contrato de saída C19 3.0.0).
# Versão PROVISÓRIA: só vira definitiva depois do GRAIN-REPRO (segunda implementação independente, FREEZE-GRAIN)
# e dos pilotos (PILOT-EXIT). O texto normativo está em grain/GRAIN.html; este arquivo é a parte executável.
# Nenhuma regra fala de provedor, de prefixo de tipo ou de sufixo de nome: as regras só leem a evidência
# neutra (seção evidence) e a classe de identidade derivada dela (seção identity_classes). O conhecimento de
# cada provedor fica nos adaptadores de evidência, fora deste arquivo.
schema: bo.grain.rules/1
contract: C19
contract_version: 3.1.0
rules_version: 0.2.1
status: PROVISIONAL
written_at: "2026-11-03T02:00:00-03:00"
amended_at: "2026-11-04T22:30:00-03:00"
definitive_after: [GRAIN-REPRO, PILOT-EXIT]

layers:
  api: operação e recurso da API do serviço (onde nascem identidade, ciclo de vida, dono e alcance)
  terraform: recurso, bloco aninhado ou grupo de atributos do schema do provider (só embalagem)
  domain: unidade canônica (ENTITY, COMPONENT, FACET, BINDING ou UNKNOWN), rótulo vindo da camada de API

evidence:
  # Campos da evidência estruturada de cada candidato. Cada campo é uma lista de alegações (claims) de fontes
  # distintas; a consolidação dá KNOWN (todas as alegações afirmadas concordam), UNKNOWN (nenhuma afirmada)
  # ou CONTRADICTORY (duas afirmadas divergem). CONTRADICTORY conta como evidência que falta.
  identity:
    meaning: identidade própria na API
    claim: {status: [present, absent], scope: [independent, within_parent], key_fields: lista, surrogate: bool, anonymous: bool}
  import_key:
    meaning: chave de importação (campos que endereçam o objeto para importá-lo)
    claim: {status: [present, absent], fields: lista}
  lifecycle_controller:
    meaning: quem cria e apaga o objeto
    claim: {kind: [self, parent, provider, external], via: campo de referência ou o pai estrutural}
  owner:
    meaning: dono da configuração
    claim: {kind: [self, parent, provider, external], via: lista de campos de referência ou o pai estrutural}
  effective_scope:
    meaning: a que a configuração se aplica de fato
    claim: {kind: [self, parent, container, global], via: campo de referência ou o pai estrutural}
  element_name_key:
    meaning: chave de nome dos elementos de uma coleção (identidade dentro do pai)
    claim: {status: [present, absent], fields: lista}
  api_resource:
    meaning: recurso ou aspecto da API a que o candidato corresponde
    claim: {status: [resource, aspect, payload], label: rótulo do domínio}

identity_classes:
  # Derivadas na ordem abaixo; a primeira que vale é a classe. K = chave natural; O = campos próprios de K;
  # T = unidades distintas apontadas pelas referências de K (o pai estrutural conta como referência quando a
  # identidade é relativa ao pai).
  - id: CONTRADICTORY
    when: identidade, chave de importação ou chave de nome em CONTRADICTORY, ou chaves afirmadas que divergem
  - id: ABSENT
    when: identidade, chave de importação e chave de nome todas UNKNOWN; ou só um id opaco (surrogate) sem a chave de importação afirmada (presente ou ausente), porque o id opaco não diz o que o objeto liga; ou bloco aninhado sem o escopo da identidade; ou candidato ligado à carga útil da API do pai sem alegação de identidade (sem ela não se sabe se é transparente ou elemento)
  - id: UNRESOLVED
    when: alguma referência de K sem alvo resolvido, ou com alvo decidido UNKNOWN
  - id: ORPHAN
    when: O e T vazios
  - id: BORROWED
    when: O vazio e uma única unidade em T
  - id: REF_TUPLE
    when: O vazio e duas ou mais unidades em T
  - id: INDEPENDENT
    when: O não vazio e T vazio
  - id: WITHIN
    when: O não vazio e uma única unidade em T
  - id: REF_TUPLE_PLUS
    when: O não vazio e duas ou mais unidades em T

predicates:
  # Vocabulário fechado: o lint reprova qualquer chave de condição fora desta lista.
  identity_class_in: a classe de identidade derivada está na lista
  identity_targets_min: número mínimo de unidades distintas em T
  identity_targets_kind_in: todo alvo de T já decidido com grão nesta lista, ou nó de ponta do tipo listado (SELECTOR e EXTERNAL são tipos de nó de ponta, não grãos; A14; EXTERNAL aceito na G1 desde a A16); alvo FACET é lido como a unidade dona da faceta (A13)
  owner_kind_in: tipo do dono consolidado está na lista
  owner_targets_count: número de unidades a que o dono resolve
  owner_targets_kind_in: todo alvo do dono já decidido com grão nesta lista
  lifecycle_kind_in: tipo do controlador de ciclo de vida está na lista
  lifecycle_target_consistent: se T não é vazio, o controlador de ciclo de vida é uma das unidades de T
  lifecycle_target_resolved: o controlador de ciclo de vida resolve a uma unidade decidida
  api_resource_status_in: estado da ligação com a API está na lista
  identity_composition_targets_min: número mínimo de unidades distintas em T sem contar os contêineres de namespace
  identity_path_parent: as referências da chave que não são de namespace apontam para UM pai que a evidência marca como segmento de caminho acima da unidade (há chave própria)
  identity_targets_all_namespace: toda referência da chave aponta para contêiner de namespace marcado pela evidência (e há chave própria)

procedure:
  # Normalização recursiva de cima para baixo: um candidato só é decidido depois do pai estrutural e dos alvos
  # das suas referências; ciclo de dependência dá UNKNOWN. Para cada candidato:
  - step: T0
    text: blocos e recursos marcados pela evidência como carga útil da API do pai (api_resource=payload, sem identidade própria) são transparentes; os átomos sobem para o pai e os blocos filhos passam a ter como pai estrutural o pai dele
  - step: T1
    text: grupos de atributos que a evidência liga a um aspecto da API viram candidatos próprios, como se fossem blocos
  - step: T3
    text: faceta implícita (emenda 0.1.8), só com fato da especificação de API que diga que os blocos só são aceitos como membros de um único objeto-faceta do pai, configurado por uma operação única sobre o pai; a forma embutida ganha o candidato pai mais faceta (id determinístico), faceta do pai com implicit e a citação, e os blocos passam a pender dele; sem a operação citada, ou se o bloco tem operação própria de criar ou apagar, não há faceta implícita
  - step: T2
    text: atributo cujo tipo cty é lista ou conjunto de objetos vira bloco repetido; os campos saem do próprio tipo como sub-átomos virtuais (caminho atributo.campo), marcados como derivados do tipo e não do schema de blocos; o átomo da coleção fica com o contêiner
  - step: R
    text: as regras abaixo são tentadas por prioridade crescente; a primeira cujo match vale decide; se faltar evidência listada em needs, o resultado é UNKNOWN com essa lista e as regras de prioridade menor NÃO são tentadas; se o guard é falso, tenta-se a próxima
  - step: Z
    text: se nenhuma regra decide, o resultado é UNKNOWN (GRAIN-G0-NOMATCH) com os campos cujos guards falharam

rules:
  - id: GRAIN-G0-IDENTITY
    priority: 0
    grain: UNKNOWN
    text: evidência de identidade ausente, contraditória ou com referência não resolvida dá UNKNOWN com a lista do que falta; nunca ENTITY por exclusão
    match: {identity_class_in: [CONTRADICTORY, ABSENT, UNRESOLVED, ORPHAN]}
    missing: [identity]
    also_missing_if_unknown: [lifecycle_controller, owner, effective_scope]

  - id: GRAIN-G1-BINDING
    priority: 1
    grain: BINDING
    text: identidade = tupla de referências a duas ou mais unidades independentes e configuração só sobre a associação (dono = a própria associação); prevalece sobre G4 mesmo quando a embalagem é um recurso separado com chave de importação própria; emenda 0.1.9, a ponta pode ser um nó SELECTOR (predicado de seleção por rótulo descrito pela evidência com citação), que não é recurso nem tem ciclo de vida
    match: {identity_class_in: [REF_TUPLE, REF_TUPLE_PLUS], identity_composition_targets_min: 2}
    needs: [lifecycle_controller, owner, effective_scope]
    guard:
      identity_targets_kind_in: [ENTITY, COMPONENT, BINDING, SELECTOR, EXTERNAL]
      owner_kind_in: [self]
    emit: {parent: none, endpoints: identity_targets}

  - id: GRAIN-G2-COMPONENT
    priority: 2
    grain: COMPONENT
    text: identidade própria dentro do pai e ciclo de vida preso ao pai, qualquer que seja a cardinalidade do bloco
    match: {identity_class_in: [WITHIN, REF_TUPLE, REF_TUPLE_PLUS, INDEPENDENT]}
    needs: [lifecycle_controller, owner, effective_scope]
    guard:
      lifecycle_kind_in: [parent]
      lifecycle_target_resolved: true
      lifecycle_target_consistent: true
    emit: {parent: lifecycle_target}

  - id: GRAIN-G2-CHILD
    priority: 3
    grain: COMPONENT
    text: emenda 0.1.7; sub-recurso com operações próprias na API continua parte do pai; identidade relativa a um pai de composição que a evidência marca como segmento de caminho acima dela, ciclo de vida de API publicado como próprio e apagamento em cascata pelo pai; sai componente do pai, com o ciclo de vida próprio registrado e o pai em cascade_delete_by
    match: {identity_class_in: [WITHIN, REF_TUPLE_PLUS], identity_path_parent: true}
    needs: [lifecycle_controller, owner, effective_scope]
    guard:
      lifecycle_kind_in: [self]
    emit: {parent: path_parent}

  - id: GRAIN-G3-FACET
    priority: 4
    grain: FACET
    text: sem identidade própria, configura um aspecto, dono da configuração = o pai, seja bloco, grupo de atributos ou recurso separado; faceta com vários donos fica no vínculo entre eles
    match: {identity_class_in: [BORROWED]}
    needs: [lifecycle_controller, owner, effective_scope, api_resource]
    guard:
      api_resource_status_in: [aspect]
      owner_kind_in: [parent]
      owner_targets_count: 1
      owner_targets_kind_in: [ENTITY, COMPONENT, BINDING, FACET]
    multi_owner: {resolve_to: binding_over_owners, else: GRAIN-G0-NOMATCH}
    emit: {parent: owner_target}

  - id: GRAIN-G4-ENTITY
    priority: 5
    grain: ENTITY
    text: identidade e ciclo de vida independentes de qualquer outra unidade
    match: {identity_class_in: [INDEPENDENT]}
    needs: [lifecycle_controller, owner, effective_scope, api_resource]
    guard:
      lifecycle_kind_in: [self, provider, external]
      api_resource_status_in: [resource]
    emit: {parent: none}

  - id: GRAIN-G4-NS
    priority: 6
    grain: ENTITY
    text: emenda 0.1.6; identidade qualificada por um contêiner de namespace marcado pela evidência não é composição; com ciclo de vida de API próprio e a identidade independente módulo o namespace, a unidade é entidade; o apagamento em cascata pelo namespace vira a relação cascade_delete_by, nunca dono nem ciclo de vida do pai; sem a marca de namespace, segue UNKNOWN
    match: {identity_class_in: [WITHIN, REF_TUPLE_PLUS], identity_targets_all_namespace: true}
    needs: [lifecycle_controller, owner, effective_scope, api_resource]
    guard:
      lifecycle_kind_in: [self]
      owner_kind_in: [self]
      api_resource_status_in: [resource]
    emit: {parent: none}

  - id: GRAIN-G0-NOMATCH
    priority: 7
    grain: UNKNOWN
    text: a evidência está completa mas nenhuma regra a aceita (ex. identidade dentro do pai com ciclo de vida próprio); UNKNOWN com os campos cujos guards falharam
    match: {}
    missing: from_failed_guards

amendments:
  # Emendas versionadas (as regras G0-G4 e os predicados não mudaram; mudaram a leitura da evidência e os candidatos).
  - id: GRAIN-A1
    version: 0.1.1
    origin: CC-1 do piloto de armazenamento (decisão do coordenador, opção b)
    text: adaptador da evidência de serviço por aspecto, com a tabela aspecto para alegação normativa no GRAIN.html; aspecto sem tradução vira alegação UNKNOWN com motivo; dono da identidade nunca vira dono da configuração; efeito de destroy que suspende a configuração é indício de faceta do pai; bloco aninhado sem fato próprio fica UNKNOWN, nunca FACET por omissão
  - id: GRAIN-A2
    version: 0.1.1
    origin: CC-NET-1 do piloto de rede
    text: passo T2 da normalização (atributo lista ou conjunto de objetos vira bloco repetido com sub-átomos virtuais derivados do tipo cty), para que a regra embutida e a regra separada tenham o mesmo grão
  - id: GRAIN-A9
    version: 0.1.7
    origin: decisão do coordenador sobre a regra de rede filha do conjunto
    text: regra nova G2-CHILD (entre G2 e G3); marca de caminho pai pela evidência (tipo de API da ponte aninhado no tipo de API do pai de contenção, ou fato explícito path_parent); G1 conta pontas sem os contêineres de namespace
  - id: GRAIN-A16
    version: 0.2.1
    origin: decisão do coordenador pela opção A do pedido de mudança (T51b) e emenda 14 do CONTRACTS (C19 3.2.0)
    text: referência tipada com valor simbólico (variável, data source ou saída de módulo) vira ponta externa do tipo do alvo, identificada pelo símbolo, sem unit_id no contrato de saída; valor computado ou desconhecido de outra forma não vira ponta; a G1 aceita a ponta EXTERNAL (como aceita SELECTOR), o que também fecha a queda indevida para a G2 de ligação com alvo externo
  - id: GRAIN-A15
    version: 0.2.0
    origin: ciclo v4 depois do PILOT-EXIT 2/2 (ajuste só na calibração), CC-NET-3 do PILOT-NET-GLOSS
    text: item sem id do provedor é COMPONENT anônimo do dono, com ocorrência = (pai, caminho, conteúdo configurado, índice de multiplicidade para duplicatas), independente da posição (T59b; item da lista sem id observado e bloco cuja chave de API o provedor atribui depois da criação); campo que a evidência dá como via do pai (ciclo de vida ou dono) continua referência ao pai mesmo quando está na chave de API (T56b); anexação descrita pela spec dá alcance próprio pela T47; a política de remoção do Terraform fica fora da decisão de grão e só a da API conta (T31); a referência simbólica tipada como ponta externa (T51b) NÃO entra (conflito com o compromisso de anexação simbólica, pedido de mudança de contrato)
  - id: GRAIN-A14
    version: 0.1.11
    origin: adendo de 04/11 §2 (nível OBSERVED, emenda 10 do C25 1.4.0), regra de consolidação R1–R5 do PREREG (04/11 17:05) e revisão adversarial
    text: o adaptador lê o nível observed e o leva para a citação; consolidação R1–R5 (nada é sobrescrito; disputa já existente resolvida por observação vale o lado reproduzido e o vencido continua citado sem voto; observação contra fato publicado sem disputa prévia é CONTRADICTORY; observação sozinha preenche o campo); identidade do item (T64) — item sem id da lista do pai é carga útil do pai e sai transparente pela procedura T0 (valor-lista do dono, sem unidade); item com id que não existe sem o pai tem a referência ao pai na chave como pai de caminho (G2-CHILD); cascade_delete_by por namespace só com evidência de cascata do tipo de namespace; SELECTOR e EXTERNAL são nós de ponta, não grãos (corrige o texto da A7)
  - id: GRAIN-A13
    version: 0.1.10
    origin: rodada final antes do PILOT-EXIT 2/2 (anexações por atributo-lista sem ocorrência de vínculo)
    text: atributo-lista de escalares do dono sem fato do SERVICE-EVIDENCE, cujos elementos são referências a recursos na configuração, vira ligação com citação do átomo do schema (R-GRAIN-LISTREF, derivada; elemento literal ou simbólico não cria ligação; fato do SE no atributo prevalece); ponta FACET do vínculo é lida como a unidade dona da faceta (a faceta não tem identidade própria), para que a lista dentro de um bloco-faceta e a lista no recurso deem o mesmo grão; ponte para campo-lista de itens do pai (item_model, list[...]) não vira aspecto pela T49 (cada bloco é um item da coleção) e, sem identidade do item, api_resource fica UNKNOWN com o motivo (T62); anexação da spec casada ao atributo (attachment_attribute) vira ligação com alvo tipado, nível INTERPRETED mantido na citação (T63); referência tipada na chave de identidade de API continua referência quando a identidade é relativa ao pai ou o campo é contêiner de namespace (T56b)
  - id: GRAIN-A12
    version: 0.1.9
    origin: saída dos pilotos 1 de 2 (o grão do tipo divergia do gabarito na camada de instância)
    text: a camada de instância passa a aplicar o mesmo que a de esquema (contêiner externo, faceta implícita, fora do domínio, bloco repetido de coleção de objetos, namespace herdado pelo bloco); ligação por atributo-lista e seleção por valor viram candidatos e ocorrências próprias, decididos só com fatos da ligação; recurso de topo de id opaco é identificado na configuração pelo endereço do recurso; bloco de id opaco segue sem identidade de ocorrência (o endereço é posicional); seleção por rótulo descrita pela evidência com citação é vínculo com um nó seletor (predicado normalizado, sem ciclo de vida), aceito como ponta pela G1; lista de ids de recurso é referência, nunca seletor; o elemento de atributo-lista é valor escalar do dono (dono = a associação, ciclo de vida do dono, alcance próprio); o gêmeo pode apontar o bloco correspondente do tipo gêmeo; a identidade de API prevalece sobre a identidade de bloco do schema
  - id: GRAIN-A11
    version: 0.1.8
    origin: decisão do coordenador sobre o par embutido e separado do conjunto de regras do contêiner
    text: passo T3 da normalização (faceta implícita), condicionado a fato da especificação com a operação única citada
  - id: GRAIN-A10
    version: 0.1.7
    origin: fatos de API das regras de rede (Authorize e Revoke sobre o conjunto)
    text: pai sem via resolvido pelo recurso pai da especificação contra a ponte do alvo da referência tipada; identidade da camada de API prevalece sobre a identidade de recurso e o formato de importação do Terraform, e referência tipada num campo dessa chave não vale
  - id: GRAIN-A8
    version: 0.1.6
    origin: decisão do coordenador sobre o achado do contêiner de namespace
    text: regra nova G4-NS (prioridade entre G4 e G0-NOMATCH); marca de namespace por fato da evidência (contenção com scope_kind de namespace ou fato explícito); relação cascade_delete_by
  - id: GRAIN-A7
    version: 0.1.5
    origin: pedido do coordenador (pai fora da fatia)
    text: referência tipada a um tipo fora da decomposição vira contêiner externo referenciado, com grão EXTERNAL; resolve identidade, ciclo de vida, dono e alcance; só a regra que lê o grão do alvo (pontas do vínculo, dono da faceta) falha e dá UNKNOWN
  - id: GRAIN-A6
    version: 0.1.4
    origin: CC-8 da evidência de serviço (fatos da especificação de API)
    text: ponte com ciclo de vida do pai vira aspecto (uma alegação só); via implícito recebe o via explícito do mesmo kind; chave compartilhada com mais de uma raiz desempata pelo recurso pai que a própria especificação nomeia; disputas entre especificação e documentação continuam como campo contraditório
  - id: GRAIN-A5
    version: 0.1.3
    origin: CC-1d e CC-1e do piloto de rede
    text: herança do gêmeo aceita via em lista (só as entradas que apontam para o tipo do bloco viram o pai); fatos da camada de API sem aspecto são consumidos e só a camada Terraform é recusada; alcance por anexação traduzido (o alcance da unidade é ela mesma, a anexação é relação); chave compartilhada é própria quando o candidato tem ciclo de vida próprio; a referência tipada ao contêiner da identidade entra na chave (identidade relativa ao contêiner)
  - id: GRAIN-A4
    version: 0.1.2
    origin: CC-1b do piloto de rede e CC-1c (alcance efetivo derivado)
    text: tabela por aspecto ganha o gêmeo (o bloco embutido herda e substitui pela evidência de API do tipo gêmeo, com a referência ao contêiner virando o pai estrutural), a referência tipada (alvo resolvido único), o bloco de timeouts como configuração do Terraform fora do domínio, o alcance derivado com kind e via, e a regra de camada (fato da camada Terraform não vira ciclo de vida, alcance nem dono de tipo de topo)
  - id: GRAIN-A3
    version: 0.1.1
    origin: emenda 3.1.0 do contrato de saída
    text: pontas do vínculo no campo endpoints do contrato de saída, em vez de itens de evidência da identidade

procedural_outcomes:
  # Desfechos do procedimento que não são regras de grão, mas aparecem em rule_applied.
  - id: GRAIN-G0-NEEDS
    grain: UNKNOWN
    text: o match de uma regra valeu, mas falta evidência listada em needs (ou o alvo dela não resolve); UNKNOWN com a lista; regras de prioridade menor não são tentadas
  - id: GRAIN-G0-CYCLE
    grain: UNKNOWN
    text: o candidato depende (pai, alvo de referência ou dono) de si mesmo por um ciclo; UNKNOWN com identity
  - id: GRAIN-G0-DUPLICATE
    grain: UNKNOWN
    text: na camada de instância, duas declarações distintas dão a mesma identidade de ocorrência com valores diferentes; as duas viram UNKNOWN com identity
  - id: GRAIN-T0-PAYLOAD
    grain: none
    text: candidato transparente (carga útil da API do pai, sem identidade própria); não vira unidade, seus átomos ficam com o pai efetivo

occurrence_identity:
  # Identidade de ocorrência (camada de instância): sha256 do JSON canônico de
  # {grain, label, parent: identidade do pai ou null, endpoints: identidades ordenadas, key: {campo: valor normalizado}}.
  # A posição textual nunca entra; só entra quando a evidência declara a ordem como campo de identidade.
  hash: sha256
  canonical_json: {sort_keys: true, separators: [",", ":"], ensure_ascii: false}
  normalizers: [str, lower, int, bool, cidr, set_of_str, set_of_lower, set_of_cidr, ordinal]
